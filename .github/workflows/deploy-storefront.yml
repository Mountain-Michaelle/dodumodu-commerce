name: deploy-storefront

# Build the storefront from the published snapshots, deploy it with Wrangler, then READ the live pages and only
# then report the publish as live. Every step reports to the Worker (scripts/ci.mjs), which is what the admin
# panel shows live - and a step that fails fails the build, with its error text, instead of leaving the panel
# on "deploying".
#
# No database credential lives here. The build fetches snapshots from the Worker (GET /ci/snapshots), guarded by
# DEPLOY_TRIGGER_SECRET.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   WORKER_URL              https://<your worker origin>       (no trailing slash)
#   DEPLOY_TRIGGER_SECRET   same value as the Worker secret of that name
#   SITE_URL                public storefront origin the verifier reads
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#
# repository_dispatch only runs the workflow file on the DEFAULT branch: merge this file there first.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this deploy is being run"
        required: false
        default: "manual"
  # The Worker sends client_payload { build_id, publish_ref, ... } - ids only, no secrets, no parameters.
  repository_dispatch:
    types: [storefront-deploy]

# One deploy at a time, never cancelling one that is mid-deploy. GitHub keeps only the NEWEST waiting run, which is
# fine: every build renders the latest publish of every product, and a cancelled run reports itself (last step).
concurrency:
  group: storefront-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  MAX_ORDER_QUANTITY: "20"
  WORKER_URL: ${{ secrets.WORKER_URL }}
  DEPLOY_TRIGGER_SECRET: ${{ secrets.DEPLOY_TRIGGER_SECRET }}
  SITE_URL: ${{ secrets.SITE_URL }}
  # The id the Worker queued for this run; a manual run makes its own.
  BUILD_ID: ${{ github.event.client_payload.build_id || format('build_{0}_{1}', github.run_id, github.run_attempt) }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dodumodu_backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            dodumodu_backend/package-lock.json
            dodumodu_site/package-lock.json

      # Reports in first, with nothing installed yet: scripts/ci.mjs needs only Node.
      - name: Report run started
        id: start
        run: node scripts/ci.mjs start

      - name: Install backend dependencies
        id: install_backend
        run: node scripts/ci.mjs step install "Installing dependencies" -- npm ci

      - name: Build site bundle
        id: site
        run: node scripts/ci.mjs step site_install "Installing site dependencies" -- npm --prefix ../dodumodu_site ci --silent && node scripts/ci.mjs step site_build "Bundling the storefront" -- npm --prefix ../dodumodu_site run build

      - name: Render storefront from published snapshots
        id: render
        run: node scripts/ci.mjs step render "Rendering the published pages" -- npm run build:site

      - name: Typecheck
        id: typecheck
        run: node scripts/ci.mjs step typecheck "Type-checking" -- npm run typecheck

      - name: Tests
        id: tests
        run: node scripts/ci.mjs step tests "Running tests" -- npm run test:deploy

      - name: Wrangler dry-run (bundle-size guard)
        id: dryrun
        run: node scripts/ci.mjs step bundle "Checking the bundle fits" -- npx wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Strict: a refusal (409 = something newer exists) stops the run here, before it can overwrite anything.
      - name: Pre-deploy staleness check
        id: predeploy
        run: node scripts/ci.mjs call pre-deploy

      - name: Deploy via Wrangler
        id: deploy
        run: node scripts/ci.mjs step deploy "Deploying to Cloudflare" -- npx wrangler deploy
        env:
          # Least-privilege token: Workers Scripts Edit only.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record deployed
        id: deployed
        run: node scripts/ci.mjs call mark-deployed

      # Reads the public pages (retrying while the deploy propagates), then asks the Worker to read them too.
      - name: Verify the live storefront
        id: verify
        run: node scripts/verify-deploy.mjs

      # Anything above failing lands here: name the step that broke. Steps that reported their own error already
      # failed the build with a better message; this only covers a run that died before it could say anything.
      - name: Report failure
        if: failure()
        run: node scripts/ci.mjs fail
        env:
          STEPS_JSON: ${{ toJSON(steps) }}

      - name: Report cancellation
        if: cancelled()
        run: node scripts/ci.mjs fail
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
