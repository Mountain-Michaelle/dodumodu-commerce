name: deploy-storefront

# Verified deploy pipeline: build the site from immutable published snapshots,
# revalidate the intended publication set (publication consistency), deploy via
# Wrangler with a least-privilege Cloudflare API token, then verify the actual
# public markers before any publication may be reported LIVE.
#
# Concurrency: a stale build that finished while a newer publish landed must
# never overwrite it. The `concurrency: storefront-deploy` group plus
# `cancel-in-progress: false` serialize deploys without cancelling the running
# one; the verification step re-reads the newest publishes and refuses to mark
# a build verified when its intended set no longer matches.

on:
  push:
    branches: ["main"]
    paths:
      - "dodumodu_backend/**"
      - "dodumodu_site/**"
      - ".github/workflows/deploy-storefront.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this deploy is being run (shown in the build record)"
        required: false
        default: "manual"
  # Triggered by the production Worker when an admin publishes/republishes a
  # product (src/external/githubDeployTrigger.ts emits event_type "storefront-deploy").
  # The dispatch carries client_payload { source: "admin-publish" } only — no URLs,
  # no secrets, no build parameters.
  repository_dispatch:
    types: [storefront-deploy]

concurrency:
  group: storefront-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Read-only Neon role for snapshot reads at build time. Never a read-write
  # connection string in CI; the Worker runtime uses its own secret.
  DATABASE_URL: ${{ secrets.NEON_READONLY_URL }}
  MAX_ORDER_QUANTITY: "20"
  # Worker origin and CI auth secret for build-status lifecycle callbacks.
  # These are GitHub Secrets; they are never logged.
  WORKER_URL: ${{ secrets.WORKER_URL }}
  DEPLOY_TRIGGER_SECRET: ${{ secrets.DEPLOY_TRIGGER_SECRET }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dodumodu_backend/package-lock.json

      - name: Install backend dependencies
        working-directory: dodumodu_backend
        run: npm ci

      - name: Build site bundle
        working-directory: dodumodu_site
        run: npm ci && npm run build

      - name: Render storefront from published snapshots
        id: render
        working-directory: dodumodu_backend
        run: |
          npm run build:site
          echo "build_id=$(node -p "require('./src/generated/build-id.json').buildId" 2>/dev/null || node -e "console.log(require('fs').readFileSync('src/generated/site.ts','utf8').match(/BUILD_ID = \"([^\"]+)\"/)[1])")" >> "$GITHUB_OUTPUT"
          echo "expected=$(node -e "const m=require('fs').readFileSync('src/generated/site.ts','utf8').match(/PRODUCTS = (\{.*?\});/s); const p=JSON.parse(m[1]); const e={}; for (const [k,v] of Object.entries(p)) e[k]=v.publishId; console.log(JSON.stringify(e))")" >> "$GITHUB_OUTPUT"
        # Fails the job rather than deploying a half-rendered build.

      - name: Typecheck
        working-directory: dodumodu_backend
        run: npm run typecheck

      - name: Tests (backend + renderer)
        working-directory: dodumodu_backend
        run: npm test

      - name: Wrangler dry-run (bundle-size guard)
        working-directory: dodumodu_backend
        run: npx wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Pre-deploy staleness check
        id: pre-deploy
        working-directory: dodumodu_backend
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${WORKER_URL}/admin/builds/${BUILD_ID}/pre-deploy" \
            -H "Authorization: Bearer ${DEPLOY_TRIGGER_SECRET}" \
            -H "Content-Type: application/json")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Pre-deploy check returned HTTP $HTTP_CODE — build is stale or ineligible, aborting before deployment."
            exit 1
          fi
          echo "Pre-deploy check passed — build is eligible to deploy."
        env:
          BUILD_ID: ${{ steps.render.outputs.build_id }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          DEPLOY_TRIGGER_SECRET: ${{ secrets.DEPLOY_TRIGGER_SECRET }}

      - name: Deploy via Wrangler
        id: deploy
        working-directory: dodumodu_backend
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Least-privilege token: Workers Scripts Edit only. Never a global
          # API key, and the value lives in GitHub Secrets, never in logs.

      - name: Mark build deployed
        if: success()
        working-directory: dodumodu_backend
        run: |
          curl -s -X POST "${WORKER_URL}/admin/builds/${BUILD_ID}/mark-deployed" \
            -H "Authorization: Bearer ${DEPLOY_TRIGGER_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}' || echo "mark-deployed callback failed (build was deployed but status not recorded)"
        env:
          BUILD_ID: ${{ steps.render.outputs.build_id }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          DEPLOY_TRIGGER_SECRET: ${{ secrets.DEPLOY_TRIGGER_SECRET }}

      - name: Verify public markers before marking LIVE
        id: verify
        working-directory: dodumodu_backend
        run: node scripts/verify-deploy.mjs
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          DATABASE_URL: ${{ secrets.NEON_READONLY_URL }}
          EXPECTED: ${{ steps.render.outputs.expected }}
          EXPECTED_BUILD_ID: ${{ steps.render.outputs.build_id }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          DEPLOY_TRIGGER_SECRET: ${{ secrets.DEPLOY_TRIGGER_SECRET }}

      - name: Mark build verified
        if: success()
        working-directory: dodumodu_backend
        run: |
          curl -s -X POST "${WORKER_URL}/admin/builds/${BUILD_ID}/mark-verified" \
            -H "Authorization: Bearer ${DEPLOY_TRIGGER_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}' || echo "mark-verified callback failed (verification passed but status not recorded)"
        env:
          BUILD_ID: ${{ steps.render.outputs.build_id }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          DEPLOY_TRIGGER_SECRET: ${{ secrets.DEPLOY_TRIGGER_SECRET }}

      - name: Record build failure
        if: failure()
        working-directory: dodumodu_backend
        run: |
          BUILD_ID="${{ steps.render.outputs.build_id }}"
          if [ -n "$BUILD_ID" ]; then
            curl -s -X POST "${WORKER_URL}/admin/builds/${BUILD_ID}/mark-failed" \
              -H "Authorization: Bearer ${DEPLOY_TRIGGER_SECRET}" \
              -H "Content-Type: application/json" \
              -d '{"error":"workflow step failed before verification completed"}' \
              || echo "mark-failed callback failed (check Worker logs)"
          else
            echo "No build ID available — build was not recorded as triggered"
          fi
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          DEPLOY_TRIGGER_SECRET: ${{ secrets.DEPLOY_TRIGGER_SECRET }}


