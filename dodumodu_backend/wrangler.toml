# dodumodu_backend/wrangler.toml
name = 'dodumodu-commerce'
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Workers Logs: keeps console.error output (structured JSON from src/shared/logger.ts) searchable in
# the Cloudflare dashboard. Server-side only; nothing here is sent to clients.
[observability]
enabled = true
head_sampling_rate = 1

# Smart Placement: every query goes to Neon over HTTPS, so most of a request's time is waiting on the database. This lets
# Cloudflare run the Worker close to Neon (it measures, and falls back to the nearest edge if that is not faster).
# To undo: delete this block. Pair it with a Neon project in the region closest to most of your admins.
[placement]
mode = "smart"

[vars]
# =============================================================================
# REQUIRED PRODUCTION VARIABLES — replace every FILL-IN placeholder below
# =============================================================================
R2_BUCKET_NAME = "skincare-media"
ENVIRONMENT = "production"
RATE_LIMIT_API_PER_MINUTE = "20"
ANALYTICS_IP_HMAC_VERSION = "1"
ANALYTICS_WARMUP_ENABLED = "true"
ASSIGNMENT_MODE_ENABLED = "true"
ADMIN_AUTH_V2 = "1"


# ---- image pipeline ----
IMAGE_MODE = "derivative"
MAX_UPLOAD_BYTES = "10485760"
MAX_IMAGE_DIMENSION = "12000"
IMAGE_KEY_PREFIX = "uploads"
IMAGE_WIDTHS_HERO = "480,768,1200"
IMAGE_WIDTHS_GALLERY = "320,640,960"
IMAGE_WIDTHS_TESTIMONIAL = "320,640"
IMAGE_WIDTHS_THUMBNAIL = "160,320"
IMAGE_QUALITY_HERO = "80"
IMAGE_QUALITY_GALLERY = "75"
IMAGE_QUALITY_TESTIMONIAL = "70"
IMAGE_QUALITY_THUMBNAIL = "70"
CATALOG_EDGE_TTL = "300"
CATALOG_EDGE_SWR = "3600"

# ---- REQUIRED before deploying images ----
IMAGE_DELIVERY_BASE = "https://media.example.com"

# =============================================================================
# NEWLY CONFIGURED VARIABLES - for easy visibility during setup review
# =============================================================================
RATE_LIMIT_ORDER_PER_PHONE_PER_HOUR = "5"
MAX_ORDER_QUANTITY = "20"
ALLOWED_ORIGINS = "https://your-worker.workers.dev,https://your-custom-domain.com"
OPAY_BASE_URL = "https://sandboxapi.opaycheckout.com"

# =============================================================================
# SECRETS - NEVER put a value for these in this file (not even a placeholder).
# Set each one with:  wrangler secret put <NAME>
#   OPAY_PUBLIC_KEY, OPAY_SECRET_KEY, OPAY_MERCHANT_ID, OPAY_WEBHOOK_SECRET
#   RECONCILE_CRON_SECRET, DEPLOY_TRIGGER_SECRET, GITHUB_DEPLOY_TOKEN
#   TURNSTILE_SECRET_KEY, RESEND_API_KEY, DATABASE_URL, ANALYTICS_IP_HMAC_SECRET
# A [vars] entry would be readable in the dashboard and would overwrite the real secret on every deploy.
# `npm run check:config` and the test suite fail if a secret or a FILL-IN placeholder appears below.
# =============================================================================
AUTH_FROM_EMAIL = "onboarding@resend.dev"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "skincare-media"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "25410516df5e4b01a3b7799889960037"