# dodumodu_backend/wrangler.toml
name = 'dodumodu-commerce'
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
# =============================================================================
# REQUIRED PRODUCTION VARIABLES — replace every FILL-IN placeholder below
# =============================================================================
R2_BUCKET_NAME = "skincare-media"
ENVIRONMENT = "production"
RATE_LIMIT_API_PER_MINUTE = "20"
ANALYTICS_IP_HMAC_VERSION = "1"
ANALYTICS_WARMUP_ENABLED = "true"
ASSIGNMENT_MODE_ENABLED = "true"
ADMIN_AUTH_V2 = "1"


# ---- image pipeline ----
IMAGE_MODE = "derivative"
MAX_UPLOAD_BYTES = "10485760"
MAX_IMAGE_DIMENSION = "12000"
IMAGE_KEY_PREFIX = "uploads"
IMAGE_WIDTHS_HERO = "480,768,1200"
IMAGE_WIDTHS_GALLERY = "320,640,960"
IMAGE_WIDTHS_TESTIMONIAL = "320,640"
IMAGE_WIDTHS_THUMBNAIL = "160,320"
IMAGE_QUALITY_HERO = "80"
IMAGE_QUALITY_GALLERY = "75"
IMAGE_QUALITY_TESTIMONIAL = "70"
IMAGE_QUALITY_THUMBNAIL = "70"
CATALOG_EDGE_TTL = "300"
CATALOG_EDGE_SWR = "3600"

# ---- REQUIRED before deploying images ----
IMAGE_DELIVERY_BASE = "https://media.example.com"

# =============================================================================
# NEWLY CONFIGURED VARIABLES - for easy visibility during setup review
# =============================================================================
PAGES_DEPLOY_HOOK = "https://api.example.com/v1/pages/deploy"
RATE_LIMIT_ORDER_PER_PHONE_PER_HOUR = "5"
MAX_ORDER_QUANTITY = "20"
ALLOWED_ORIGINS = "https://https://your-worker.workers.dev,https://your-custom-domain.com"
# Public origin of the deployed Worker, e.g. https://<your-worker>.workers.dev
WORKER_URL = "https://your-worker.workers.dev"
OPAY_BASE_URL = "https://sandboxapi.opaycheckout.com"

# =============================================================================
# SECRETS — set each one with: wrangler secret put <NAME>
# These are listed here explicitly so none are missed. Do NOT commit real values.
# =============================================================================
OPAY_PUBLIC_KEY = "FILL-IN-via-wrangler-secret-put"
OPAY_SECRET_KEY = "FILL-IN-via-wrangler-secret-put"
OPAY_MERCHANT_ID = "FILL-IN-via-wrangler-secret-put"
OPAY_WEBHOOK_SECRET = "FILL-IN-via-wrangler-secret-put"
AUTH_FROM_EMAIL = "onboarding@resend.dev"
# Secret used by CI to authenticate build-status mutations (mark-deployed/verified/failed).
# Set via: wrangler secret put DEPLOY_TRIGGER_SECRET
DEPLOY_TRIGGER_SECRET = "FILL-IN-via-wrangler-secret-put"
# Secret used by the production Worker to authenticate GitHub repository_dispatch calls.
# Set via: wrangler secret put GITHUB_DEPLOY_TOKEN
GITHUB_DEPLOY_TOKEN = "FILL-IN-via-wrangler-secret-put"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "skincare-media"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "25410516df5e4b01a3b7799889960037"
