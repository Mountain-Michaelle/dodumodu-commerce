<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sessions</title>
  <link rel="stylesheet" href="/auth-ui/auth.css" />
</head>
<body>
  <main class="page-shell" data-page="sessions">
    <header class="page-header">
      <div class="header-info">
        <h1>Sessions</h1>
        <p class="page-subtitle" id="subtitle">End any session you don't recognize.</p>
      </div>
      <div class="header-actions">
        <a href="/admin/" class="btn-link" aria-label="Back to admin console">&larr; Back to console</a>
      </div>
    </header>

    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Search user, email, user ID, session ID, device, IP…" aria-label="Search sessions" autocomplete="off" />
      <select id="scope" class="sessions-scope" aria-label="Which sessions">
        <option value="mine">My sessions</option>
        <option value="all">All users</option>
      </select>
      <span class="muted small" id="count" aria-live="polite"></span>
    </div>

    <section class="table-section">
      <div class="table-scroll">
        <div class="table-inner">
          <div class="table-head" role="row">
            <div class="th">User</div>
            <div class="th">Device / Browser</div>
            <div class="th">Last activity</div>
            <div class="th">Status</div>
            <div class="th right">Actions</div>
          </div>
          <div class="table-body" id="list" aria-live="polite"><div class="state">Loading…</div></div>
        </div>
      </div>
      <div class="pager" id="pager" hidden></div>
    </section>

    <section class="danger-zone">
      <h2 class="danger-zone-title">Danger zone</h2>
      <p class="danger-zone-subtitle">Actions that affect all of your own sessions at once.</p>
      <div class="danger-actions">
        <button class="btn-ghost" id="revoke-others" type="button">Sign out everywhere else</button>
        <button class="btn-danger" id="logout" type="button">Sign out</button>
      </div>
    </section>

    <p class="note" id="note" hidden></p>
  </main>
  <script src="/auth-ui/admin-ui.js" defer></script>
  <script src="/auth-ui/sessions.js" defer></script>
</body>
</html>
