<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trusted Devices</title>
  <link rel="stylesheet" href="/auth-ui/auth.css" />
</head>
<body>
  <main class="page-shell" data-page="devices">
    <header class="page-header">
      <div class="header-info">
        <h1>Trusted Devices</h1>
        <p class="page-subtitle">Admins only. Revoke a device to end its sessions at once.</p>
      </div>
      <div class="header-actions">
        <button class="btn-primary" id="invite" type="button" aria-label="Add a device">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <a href="/admin/" class="btn-link" aria-label="Back to admin console">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </a>
      </div>
    </header>

    <section class="table-section">
      <div class="table-head">
        <div class="th">Device</div>
        <div class="th">Identifier</div>
        <div class="th">Trust Status</div>
        <div class="th">Created Via</div>
        <div class="th">Last Seen</div>
        <div class="th">Actions</div>
      </div>
      <div class="table-body" id="list"><span class="muted">Loading…</span></div>
    </section>

    <div id="invite-box" class="once" hidden></div>
    <p class="note" id="note" hidden></p>
  </main>
  <script src="/auth-ui/devices.js" defer></script>
</body>
</html>
