<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trusted Devices</title>
  <link rel="stylesheet" href="/auth-ui/auth.css" />
</head>
<body>
  <main class="page-shell" data-page="devices">
    <header class="page-header">
      <div class="header-info">
        <h1>Trusted Devices</h1>
        <p class="page-subtitle">Admins only. Revoke a device to end its sessions at once.</p>
      </div>
      <div class="header-actions">
        <button class="btn-primary" id="invite" type="button">+ Add a device</button>
        <a href="/admin/" class="btn-link" aria-label="Back to admin console">&larr; Back to console</a>
      </div>
    </header>

    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Search user, email, user ID, device ID, name, IP…" aria-label="Search devices" autocomplete="off" />
      <span class="muted small" id="count" aria-live="polite"></span>
    </div>

    <div id="invite-box" class="once" hidden></div>
    <p class="note" id="note" hidden></p>

    <section class="table-section">
      <div class="table-scroll">
        <div class="table-inner">
          <div class="table-head" role="row">
            <div class="th">User</div>
            <div class="th">Device</div>
            <div class="th">Trust status</div>
            <div class="th">Created via</div>
            <div class="th">Last seen</div>
            <div class="th right">Actions</div>
          </div>
          <div class="table-body" id="list" aria-live="polite"><div class="state">Loading…</div></div>
        </div>
      </div>
      <div class="pager" id="pager" hidden></div>
    </section>
  </main>
  <script src="/auth-ui/admin-ui.js" defer></script>
  <script src="/auth-ui/devices.js" defer></script>
</body>
</html>
